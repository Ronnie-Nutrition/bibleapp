name: iOS Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '14.2'

    - name: Install dependencies
      run: |
        cd ios
        pod install

    - name: Build app
      run: |
        cd ios
        xcodebuild -workspace BibleApp.xcworkspace \
          -scheme BibleApp \
          -configuration Debug \
          -derivedDataPath build \
          build

    - name: Run tests
      run: |
        cd ios
        xcodebuild -workspace BibleApp.xcworkspace \
          -scheme BibleApp \
          -configuration Debug \
          -derivedDataPath build \
          test

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: iOS-build-artifacts
        path: ios/build/

  code-quality:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run SwiftLint
      run: |
        if brew list swiftlint &>/dev/null; then
          cd ios
          swiftlint
        else
          echo "SwiftLint not installed"
        fi
      continue-on-error: true
