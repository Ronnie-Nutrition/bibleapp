# Bible App Nginx Configuration

# Upstream servers
upstream django_backend {
    server django:8000;
    keepalive 32;
}

upstream nodejs_backend {
    server nodejs:3001;
    keepalive 32;
}

# HTTP to HTTPS redirect (production)
server {
    listen 80;
    server_name _;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Redirect to HTTPS in production
    # Uncomment the following lines for production with SSL
    # return 301 https://$server_name$request_uri;
    
    # For development, proxy directly
    location / {
        include /etc/nginx/conf.d/proxy_params;
        
        # Route API requests
        location ~ ^/api/django/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/django/(.*)$ /$1 break;
            proxy_pass http://django_backend;
        }
        
        location ~ ^/api/nodejs/ {
            limit_req zone=api burst=20 nodelay;
            rewrite ^/api/nodejs/(.*)$ /$1 break;
            proxy_pass http://nodejs_backend;
        }
        
        # Auth endpoints with stricter rate limiting
        location ~ ^/api/(django|nodejs)/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://django_backend;
        }
        
        # Default to Django for admin and other routes
        proxy_pass http://django_backend;
    }
    
    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Media files
    location /media/ {
        alias /var/www/media/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }
}

