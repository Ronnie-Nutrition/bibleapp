apiVersion: v1
kind: Service
metadata:
  name: bible-app-backend
  namespace: default
  labels:
    app: bible-app
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # For AWS
    # cloud.google.com/load-balancer-type: "Internal"  # Uncomment for GCP
spec:
  type: ClusterIP
  selector:
    app: bible-app
    component: backend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
